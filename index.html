<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badini Voice Studio — رومی هەرکی</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .box {
      max-width: 640px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: #38bdf8; }
    p.sub { margin: 0 0 16px; font-size: 13px; color: #cbd5e1; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; font-weight: bold; }
    textarea, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .half { flex: 1 1 180px; }
    button {
      margin-top: 12px;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-blue { background: #0284c7; color: #fff; flex: 1; }
    .btn-green { background: #16a34a; color: #fff; flex: 1; }
    .btn-gray { background: #475569; color: #fff; }
    audio { width: 100%; margin-top: 12px; }
    .status {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ستۆدیۆیا دەنگێ بادینی — رومی هەرکی</h1>
    <p class="sub">نموونەیا دەنگێ رومی هەرکی هەلبژێرە یان تۆمار بکە، تێکستێ بادینی بنڤیسە، و تاقی بکە.</p>

    <label for="voiceFile">١. نموونەیا دەنگی (فایلێ دەنگێ رومی هەرکی):</label>
    <input id="voiceFile" type="file" accept="audio/*" />

    <div class="row">
      <button type="button" class="btn-gray" id="recBtn">تۆمارکرن ب مایکرۆفۆنێ</button>
      <button type="button" class="btn-gray" id="stopRecBtn" disabled>راوەستاندنا تۆمارکرنێ</button>
    </div>
    <audio id="samplePlayer" controls></audio>

    <label for="badiniText">٢. تێکستێ بادینی:</label>
    <textarea id="badiniText" placeholder="ل ڤێرە تێکستێ خۆ یێ بادینی بنڤیسە..."></textarea>

    <div class="row">
      <div class="half">
        <label for="rateInput">خێرایی (0.5 - 1.5):</label>
        <input id="rateInput" type="text" value="1.0" />
      </div>
      <div class="half">
        <label for="pitchInput">تۆن (0.5 - 1.5):</label>
        <input id="pitchInput" type="text" value="1.0" />
      </div>
    </div>

    <label for="endpointInput">٣. Endpoint یێ API / Proxy (ئارەزوومەندانە):</label>
    <input id="endpointInput" type="text" value="https://badini-voice-proxy.samrrekani72.workers.dev" />

    <div class="row">
      <button type="button" class="btn-blue" id="speakBtn">خویندنا تێکستی (وێبگەڕ)</button>
      <button type="button" class="btn-green" id="sendApiBtn">هنارتن بۆ Endpoint</button>
    </div>

    <audio id="resultPlayer" controls></audio>
    <div class="status" id="statusBox">ئامادەیە بۆ کارکرن.</div>
  </div>

  <script>
    const voiceFileInput = document.getElementById("voiceFile");
    const samplePlayer = document.getElementById("samplePlayer");
    const resultPlayer = document.getElementById("resultPlayer");
    const badiniText = document.getElementById("badiniText");
    const rateInput = document.getElementById("rateInput");
    const pitchInput = document.getElementById("pitchInput");
    const endpointInput = document.getElementById("endpointInput");
    const statusBox = document.getElementById("statusBox");
    const recBtn = document.getElementById("recBtn");
    const stopRecBtn = document.getElementById("stopRecBtn");
    const speakBtn = document.getElementById("speakBtn");
    const sendApiBtn = document.getElementById("sendApiBtn");

    let selectedAudioBlob = null;
    let selectedAudioName = "rumi_herki_sample.webm";
    let mediaRecorder = null;
    let chunks = [];

    function setStatus(msg) {
      statusBox.textContent = msg;
    }

    voiceFileInput.addEventListener("change", () => {
      const file = voiceFileInput.files[0];
      if (!file) return;
      selectedAudioBlob = file;
      selectedAudioName = file.name;
      samplePlayer.src = URL.createObjectURL(file);
      setStatus("فایلێ دەنگی هاتە هەلبژارتن: " + file.name);
    });

    recBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          selectedAudioBlob = new Blob(chunks, { type: "audio/webm" });
          selectedAudioName = "recorded_voice.webm";
          samplePlayer.src = URL.createObjectURL(selectedAudioBlob);
          stream.getTracks().forEach((t) => t.stop());
          setStatus("تۆمارکرنا دەنگی ب دوماهی هات و ئامادەیە.");
        };
        mediaRecorder.start();
        recBtn.disabled = true;
        stopRecBtn.disabled = false;
        setStatus("دەنگ دهێتە تۆمارکرن...");
      } catch (err) {
        setStatus("خەلەتی د ڤەکرنا مایکرۆفۆنێ دا: " + err.message);
      }
    });

    stopRecBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      recBtn.disabled = false;
      stopRecBtn.disabled = true;
    });

    speakBtn.addEventListener("click", () => {
      const text = badiniText.value.trim();
      if (!text) {
        setStatus("هیڤیە تێکستەکێ بادینی بنڤیسە.");
        return;
      }
      if (!("speechSynthesis" in window)) {
        setStatus("وێبگەڕێ تە پشتگیرییا SpeechSynthesis ناکەت.");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = parseFloat(rateInput.value) || 1.0;
      utter.pitch = parseFloat(pitchInput.value) || 1.0;
      utter.onstart = () => setStatus("تێکست دهێتە خویندن...");
      utter.onend = () => setStatus("خویندنا تێکستی ب دوماهی هات.");
      utter.onerror = (e) => setStatus("خەلەتی د خویندنا دەنگی دا: " + e.error);
      window.speechSynthesis.speak(utter);
    });

    sendApiBtn.addEventListener("click", async () => {
      const text = badiniText.value.trim();
      const endpoint = endpointInput.value.trim();
      if (!endpoint) {
        setStatus("لینکێ Endpoint یێ بەتاڵە.");
        return;
      }
      if (!text) {
        setStatus("تێکستێ بادینی بنڤیسە.");
        return;
      }

      setStatus("داخوازی دهێتە هنارتن بۆ: " + endpoint);
      const formData = new FormData();
      formData.append("text", text);
      formData.append("rate", rateInput.value || "1.0");
      formData.append("pitch", pitchInput.value || "1.0");
      if (selectedAudioBlob) {
        formData.append("voice_sample", selectedAudioBlob, selectedAudioName);
      }

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          body: formData,
        });
        const contentType = res.headers.get("content-type") || "";
        if (!res.ok) {
          const errText = await res.text();
          setStatus("بەرسڤ (" + res.status + "): " + errText);
          return;
        }
        if (contentType.includes("audio")) {
          const blob = await res.blob();
          resultPlayer.src = URL.createObjectURL(blob);
          resultPlayer.play();
          setStatus("فایلێ دەنگی هات و دهێتە لێدان.");
        } else {
          const dataText = await res.text();
          setStatus("بەرسڤا سێرڤەری:\n" + dataText);
        }
      } catch (err) {
        setStatus("خەلەتی د پەیوەندییا نەتۆرکێ دا: " + err.message);
      }
    });
  </script>
</body>
</html>
